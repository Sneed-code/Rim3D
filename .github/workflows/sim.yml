name: Sim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S game/Plugins/ColonySim -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Map picture
        if: runner.os == 'Linux'
        run: ./build/simrun --seed 42 --size 512 --days 1 --png map.png
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: map-preview
          path: map.png

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check data files
        run: python3 tools/check_defs.py
      - name: Importer tests
        run: python3 -m unittest discover -s tools/tests -v
