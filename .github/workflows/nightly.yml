name: Nightly soak

# Raid soak (F7, docs/design/raid-soak.md): firefights and raids over many seeds, once a night.
# Reports deaths, stuck fighters and fight length in the run's summary and fails if a rule broke.
# Not on pull requests, so it costs nothing per change.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds to play'
        default: '40'

jobs:
  raid-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S game/Plugins/ColonySim -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel --target simrun
      - name: Play the seeds
        run: |
          set -o pipefail
          ./build/simrun --seed 1000 --raid-soak "${SEEDS:-40}" | tee soak.txt
        env:
          SEEDS: ${{ github.event.inputs.seeds }}
      - name: Summary
        if: always()
        run: |
          {
            echo '## Raid soak'
            echo '```'
            cat soak.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raid-soak
          path: soak.txt

  sim-cost:
    # The sim cost check (task S9, docs/design/sim-cost.md): a game day of a Stage 2 sized colony on a 1 km map,
    # timed per system. Fails if the average step costs more than the budget in docs/decisions/0006-sim-cost-budget.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S game/Plugins/ColonySim -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4 --target simrun
      - name: Sim cost
        run: ./build/simrun --perf --days 1 --budget 2.0 > perf.json 2> perf-table.txt
      - name: Show the table
        if: always()
        run: cat perf-table.txt perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-cost
          path: |
            perf.json
            perf-table.txt
