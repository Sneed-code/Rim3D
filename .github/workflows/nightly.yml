name: Nightly soak

# Raid soak (F7, docs/design/raid-soak.md): firefights and raids over many seeds, once a night.
# Reports deaths, stuck fighters and fight length in the run's summary and fails if a rule broke.
# Not on pull requests, so it costs nothing per change.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'How many seeds to play'
        default: '40'

jobs:
  raid-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S game/Plugins/ColonySim -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel --target simrun
      - name: Play the seeds
        run: |
          set -o pipefail
          ./build/simrun --seed 1000 --raid-soak "${SEEDS:-40}" | tee soak.txt
        env:
          SEEDS: ${{ github.event.inputs.seeds }}
      - name: Summary
        if: always()
        run: |
          {
            echo '## Raid soak'
            echo '```'
            cat soak.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raid-soak
          path: soak.txt
